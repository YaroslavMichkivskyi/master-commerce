# Lint, type check and tests (FR-050, FR-051).
# Automatic on pushes and PRs to dev / main: every check, affected packages only.
# By hand (Actions → ci → Run workflow, or `gh workflow run ci.yml --ref <branch> -f …`):
# pick the branch and the checks below.
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      lint:
        description: ESLint and Prettier
        type: boolean
        default: true
      typecheck:
        description: TypeScript type check
        type: boolean
        default: true
      test:
        description: Unit tests
        type: boolean
        default: false
      integration:
        description: Integration tests (Testcontainers, slowest)
        type: boolean
        default: false
      scope:
        description: All packages, or only those changed against dev
        type: choice
        options: [all, affected]
        default: all

# An outdated PR or manual run is cancelled. Push runs on dev / main never are: each one
# checks only what changed since the previous push, so a cancelled (or replaced pending)
# run would leave a change unchecked; every push gets its own group.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Automatic runs do every check; a manual run does only the ticked ones.
      DO_LINT: ${{ github.event_name != 'workflow_dispatch' || inputs.lint }}
      DO_TYPECHECK: ${{ github.event_name != 'workflow_dispatch' || inputs.typecheck }}
      DO_TEST: ${{ github.event_name != 'workflow_dispatch' || inputs.test }}
      DO_INTEGRATION: ${{ github.event_name != 'workflow_dispatch' || inputs.integration }}
      SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'affected' }}
      # The base for --affected is set explicitly: turbo's own detection fails when checkout
      # has no local branches. PR: the target branch; push: the commit before the push;
      # manual run: dev.
      TURBO_SCM_BASE: >-
        ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref)
        || github.event_name == 'push' && github.event.before
        || 'origin/dev' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # --affected compares with the base commit

      - uses: pnpm/action-setup@v6.1.1 # version from packageManager in package.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        if: env.DO_LINT == 'true'
        run: pnpm format:check

      - name: Checks
        run: |
          tasks=()
          [ "$DO_LINT" = true ] && tasks+=(lint)
          [ "$DO_TYPECHECK" = true ] && tasks+=(typecheck)
          [ "$DO_TEST" = true ] && tasks+=(test)
          [ "$DO_INTEGRATION" = true ] && tasks+=(test:integration)
          if [ ${#tasks[@]} -eq 0 ]; then
            echo "::notice::No checks selected"
            exit 0
          fi
          flags=()
          [ "$SCOPE" = affected ] && flags+=(--affected)
          echo "turbo run ${tasks[*]} ${flags[*]} (base: $TURBO_SCM_BASE)"
          pnpm turbo run "${tasks[@]}" "${flags[@]}"
