# Visual, accessibility and budget tests of the storefront (specs/036-web-design R-7, R-8):
# the same Docker stack as locally (apps/web/e2e/compose.yaml) — the shop and its services
# built in the official Playwright image, every case of test-cases.md compared with the
# committed screenshots and checked with axe. Docker only: no Node or pnpm on the runner.
# Runs on pull requests that touch anything built into the test image: the apps, the
# shared packages, the data generator, the dependencies, or this workflow.
name: web-visual

on:
  pull_request:
    branches: [dev, main]
    paths:
      - apps/**
      - shared/**
      - packages/**
      - tools/datagen/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - .dockerignore
      - .github/workflows/web-visual.yml
  workflow_dispatch:

concurrency:
  group: web-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web/e2e
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the test image
        run: docker compose build prepare

      - name: Visual tests
        run: docker compose run --rm tests

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web-visual-report
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 14
