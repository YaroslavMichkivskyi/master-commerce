# Local infrastructure only; the apps run on the host with hot reload (ADR 0017).
# Ports and credentials come from `.env` (copied from `.env.example` by `pnpm dev`).
name: master-commerce

x-postgres: &postgres
  image: postgres:17.11-alpine
  restart: unless-stopped
  mem_limit: 256m
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
    interval: 2s
    timeout: 3s
    retries: 30

services:
  postgres-identity:
    <<: *postgres
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local}
    ports:
      - '${POSTGRES_IDENTITY_PORT:-55432}:5432'
    volumes:
      - identity-data:/var/lib/postgresql/data

  postgres-catalog:
    <<: *postgres
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_local}
    ports:
      - '${POSTGRES_CATALOG_PORT:-55433}:5432'
    volumes:
      - catalog-data:/var/lib/postgresql/data

  postgres-orders:
    <<: *postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ${ORDERS_DB_USER:-orders}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_local}
    ports:
      - '${POSTGRES_ORDERS_PORT:-55434}:5432'
    volumes:
      - orders-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shop_local}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_UI_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  identity-data:
  catalog-data:
  orders-data:
  rabbitmq-data:
